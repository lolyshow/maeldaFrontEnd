<div class="max-w-6xl mx-auto p-6">
  <h2 class="text-3xl font-bold mb-6">Shopping Cart</h2>

  <div *ngIf="cartItems.length; else emptyCart" class="grid lg:grid-cols-3 gap-6">

    <!-- Cart Items -->
    <div class="lg:col-span-2 space-y-4">
      <div *ngFor="let item of cartItems" class="flex gap-4 p-4 border rounded shadow">
        <img [src]="item.image || '/placeholder.jpg'" alt="{{item.name}}" class="w-24 h-24 object-cover rounded">

        <div class="flex-1">
          <h3 class="text-xl font-semibold">{{ item.name }}</h3>
          <p class="text-gray-500">₦{{ item.price | number:'1.2-2' }}</p>

          <div class="flex items-center mt-2 space-x-2">
            <button (click)="decrease(item)" class="px-2 py-1 border rounded">−</button>
            <span>{{ item.count }}</span>
            <button (click)="increase(item)" class="px-2 py-1 border rounded">+</button>
          </div>
        </div>

        <div class="text-right">
          <p class="font-bold">₦{{ getItemTotal(item) | number:'1.2-2' }}</p>
          <button (click)="remove(item)" class="text-red-500 text-sm mt-2">Remove</button>
        </div>
      </div>
    </div>

    <!-- Summary -->
    <div class="p-4 border rounded shadow bg-gray-50 h-fit">
      <h3 class="text-xl font-semibold mb-4">Order Summary</h3>
      <div class="flex justify-between mb-2">
        <span>Total Items:</span>
        <span>{{ cartItems.length }}</span>
      </div>
      <div class="flex justify-between font-bold text-lg">
        <span>Total:</span>
        <span>₦{{ getTotal() | number:'1.2-2' }}</span>
      </div>
      <button class="mt-6 w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">
        Proceed to Checkout
      </button>
    </div>

  </div>

  <!-- Empty Cart Message -->
  <ng-template #emptyCart>
    <div class="text-center py-20">
      <p class="text-gray-600 text-xl">🛒 Your cart is empty.</p>
      <a routerLink="/home" class="mt-4 inline-block text-blue-600 hover:underline">Go back to shop</a>
    </div>
  </ng-template>
</div>
