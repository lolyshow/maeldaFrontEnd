<main class="main">
  <div class="content">
    <app-header></app-header>

    <div class="bg-[#f7f7f7] h-screen">
      <app-hero>

      </app-hero>

      <div class="flex w-full mt-[80px] gap-3 lg:max-w-7xl sm:max-w-6xl mx-auto items-center">

        <div class="bg-white w-[30%] h-60 flex items-center border-[1px] rounded">
          <div class="p-6  ">
            <p class="text-[#777777] text-[16px]">Flat 50% Discount</p>
            <p class="text-[24px] font-medium capitalize leading-[30px] mb-[24px] mt-[11px]">Indoor Plants</p>
            <div class="mt-4">
              <app-button></app-button>
            </div>
          </div>

          <div>
            <img src="/images/meat.jpeg" class=" h-24">
          </div>
        </div>
        <div class="bg-white w-[70%] h-60 border-[1px] rounded">
          <div class="h-full flex justify-between">
            <img src="/images/flower.png" class="h-full" />
            <div class="flex flex-col justify-center items-center">
              <p class="text-[#777777] text-[16px]">Flat 50% Discount</p>
              <p class="text-[24px] font-medium capitalize leading-[30px] mb-[24px] mt-[11px]">Indoor Plants</p>
              <div class="mt-2">
                <app-button></app-button>
              </div>
            </div>
            <img src="/images/plant.png" class="h-full justify-end" />

          </div>
        </div>

      </div>

      <div class="flex justify-center">
        <div>
          <h1 class="my-10 text-[30px] font-medium">
            Trending products</h1>
          <div class="flex">
            <hr class=" w-[33.33%] border mt-[1px]" />
            <hr
              class="bg-[#6bb42f] border-[#6bb42f] text-center flex items-center justify-center w-[33.33%] h-1 text-rose-500 border" />
            <hr class=" w-[33.33%] mt-[1px] border " />
          </div>
        </div>
      </div>
      <ul class="flex gap-4 justify-center mt-10">
        <li class="flex justify-center items-center rounded-full h-12 w-32 bg-[#6bb42f] text-white"
          (click)="handleSwitchTab('chicken')"> <a>Chicken</a></li>
        <li class="flex justify-center items-center rounded-full h-12 w-32 bg-white border"
          (click)="handleSwitchTab('Lamb')"><a>Lamb</a></li>
        <li class="flex justify-center items-center rounded-full h-12 w-32 bg-white border"
          (click)="handleSwitchTab('Beef')"><a>Beef</a>
        </li>
        <li class="flex justify-center items-center rounded-full h-12 w-32 bg-white border"
          (click)="handleSwitchTab('Fish')"><a>Fish</a>
        </li>
      </ul>

      <!-- product card wrapper -->
      <div class="flex w-full flex-wrap justify-between py-5 lg:max-w-7xl sm:max-w-6xl mx-auto items-center">
        <app-product-card *ngFor="let product of products" [product]="product"
          (cartUpdate)="addToCart($event)"></app-product-card>


      </div>

      <div class="flex justify-center my-10">
        <div>
          <h1 class="text-[30px] font-medium">
            Special products</h1>
          <div class="flex mt-4">
            <hr class=" w-[33.33%] border " />
            <hr
              class="bg-[#6bb42f] border-[#6bb42f] text-center flex items-center justify-center w-[33.33%] h-1 text-rose-500 border" />
            <hr class=" w-[33.33%] border " />
          </div>
        </div>
      </div>


      <!-- product card wrapper -->
      <div class="flex w-full flex-wrap justify-between py-5 lg:max-w-7xl sm:max-w-6xl mx-auto items-center">
        <div *ngFor="let item of dummyProduct" class="card mt-6 rounded border bg-white h-96 w-[300px] pb-4 relative">
          <div class="flex flex-col justify-center items-center w-full h-full">
            <div class="flex justify-center items-center  w-full  h-[100rem]">
              <img src="/images/meat.jpeg" class="w-48">
            </div>

            <div class="border-t w-[94%] pt-4 flex flex-col items-center justify-center">
              <p class="">Air Plant</p>
              <span itemprop="price" class="text-[#6bb42f] text-base leading-5 font-medium">$22.94</span>
              <div class="flex mt-2">
                <input value="1" name="" type="number"
                  class="w-14 border-[1px] bg-[#f7f7f7] border-[#e5e5e5] p-3 rounded-l-full">
                <button class="before:ease px-6 rounded-r-full flex justify-center items-center bg-blue-900 ${customStyle} text-[17px] relative
    h-full py-1 overflow-hidden shadow-2xl before:absolute before:left-0 before:-ml-2 before:h-48 before:w-48
    before:origin-top-right before:-translate-x-full before:translate-y-12 before:-rotate-90 before:bg-[#6bb42f]
    before:transition-all before:duration-300 hover:text-white hover:shadow-black hover:before:-rotate-180">
                  <span class="relative z-10 text-sm text-white">Add to Cart</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <app-footer></app-footer>

    </div>
  </div>


</main>
<app-cart-modal #cartModal></app-cart-modal>
